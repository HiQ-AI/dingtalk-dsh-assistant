name: Extended compatibility checks
on:
  workflow_dispatch:
    inputs:
      scope:
        description: All mapped tests, historical workflows, or fixed native diagnostic lanes
        type: choice
        default: all
        options: [all, history, native-0, native-1]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(inputs.scope == 'native-0' && '["native-0"]' || inputs.scope == 'native-1' && '["native-1"]' || inputs.scope == 'history' && '["history"]' || '["unit","native-0","native-1","compat-0","compat-1","compat-2","history"]') }}
    env:
      DSH_NATIVE_CLEANUP_DIAGNOSTICS: ${{ (inputs.scope == 'native-0' || inputs.scope == 'native-1') && '1' || '' }}
      DSH_NATIVE_TEST_PROFILE: ${{ github.workspace }}/test/fixtures/native-profile/package.json
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/release-test-env
      - run: node scripts/test-suites.mjs run ${{ matrix.lane }}
