name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing annotated version tag in main history
        required: true
        type: string

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  DSH_NATIVE_TEST_PROFILE: ${{ github.workspace }}/test/fixtures/native-profile/package.json

jobs:
  resolve:
    runs-on: windows-latest
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - id: identity
        shell: pwsh
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'release_tag_must_point_to_main_history' }
          $tagVersion = $env:RELEASE_TAG -replace '^v', ''
          if ($tagVersion -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "invalid_release_tag_$($env:RELEASE_TAG)" }
          $manifests = @('package.json', 'packages/dingtalk-dsh-assistant/package.json', 'packages/dingtalk-dsh-observer/package.json')
          $versions = $manifests | ForEach-Object { (Get-Content -LiteralPath $_ -Raw | ConvertFrom-Json).version }
          if (($versions | Select-Object -Unique).Count -ne 1 -or $versions[0] -ne $tagVersion) {
            throw "version_mismatch_tag_$tagVersion`_packages_$($versions -join ',')"
          }
          $changelog = Get-Content -LiteralPath 'CHANGELOG.md' -Raw
          $escapedVersion = [regex]::Escape($tagVersion)
          if ($changelog -notmatch "(?m)^## \[$escapedVersion\] - \d{4}-\d{2}-\d{2}\r?$") {
            throw "changelog_entry_missing_$tagVersion"
          }
          $releaseUrl = "https://github.com/HiQ-AI/dingtalk-dsh-assistant/releases/tag/v$tagVersion"
          if ($changelog -notmatch "(?m)^\[$escapedVersion\]: $([regex]::Escape($releaseUrl))\r?$") {
            throw "changelog_release_link_missing_$tagVersion"
          }
          if ((git cat-file -t "refs/tags/$env:RELEASE_TAG") -ne 'tag') { throw 'annotated_release_tag_required' }
          "sha=$(git rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
  validate:
    needs: resolve
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [unit, native-0, native-1, compat-0, compat-1, compat-2]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: ./.github/actions/release-test-env
      - name: Verify exhaustive classification and run isolated lane
        shell: pwsh
        run: node scripts/test-suites.mjs run ${{ matrix.lane }}
  build:
    needs: [resolve, validate]
    runs-on: windows-latest
    env:
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: ./.github/actions/release-test-env
      - name: Build immutable packages from verified SHA
        shell: pwsh
        run: |
          node scripts/build-web-client.mjs
          git diff --exit-code -- packages/dingtalk-dsh-assistant/web-client.js
          if ($LASTEXITCODE -ne 0) { throw 'web_client_bundle_not_committed' }
          New-Item -ItemType Directory -Path docs/tmp/packages | Out-Null
          pnpm pack --pack-destination docs/tmp/packages
          if ($LASTEXITCODE -ne 0) { throw 'root_pack_failed' }
          pnpm --dir packages/dingtalk-dsh-assistant pack --pack-destination ../../docs/tmp/packages
          if ($LASTEXITCODE -ne 0) { throw 'assistant_pack_failed' }
          pnpm --dir packages/dingtalk-dsh-observer pack --pack-destination ../../docs/tmp/packages
          if ($LASTEXITCODE -ne 0) { throw 'observer_pack_failed' }
          node scripts/release-artifacts.mjs create
          if ($LASTEXITCODE -ne 0) { throw 'release_package_inspection_failed' }
          $env:RELEASE_PACKAGE_DIRECTORY = Join-Path $PWD 'docs/tmp/packages'
          node --test test/task-session-package-native.test.js
          if ($LASTEXITCODE -ne 0) { throw 'built_package_native_smoke_failed' }
          node scripts/release-artifacts.mjs verify
          if ($LASTEXITCODE -ne 0) { throw 'release_package_changed_after_smoke' }
      - uses: actions/upload-artifact@v7
        with:
          name: verified-packages-${{ needs.resolve.outputs.sha }}
          path: docs/tmp/packages/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [resolve, build]
    runs-on: windows-latest
    environment: NPM_PUBLISH
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - shell: pwsh
        run: npm install --global npm@12.0.2
      - uses: actions/download-artifact@v8
        with:
          name: verified-packages-${{ needs.resolve.outputs.sha }}
          path: docs/tmp/packages
      - name: Verify same-run SHA, lock, environment and every package hash
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:RELEASE_SHA -or (git rev-parse "$env:RELEASE_TAG^{commit}") -ne $env:RELEASE_SHA) { throw 'release_sha_changed' }
          node scripts/release-artifacts.mjs verify
          if ($LASTEXITCODE -ne 0) { throw 'verified_release_artifact_mismatch' }
      - name: 按依赖顺序发布 npm
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          function Publish-NpmPackage {
            param([string]$Tarball, [string]$Package)
            $publishedShasum = npm view $Package dist.shasum --registry https://registry.npmjs.org/ 2>$null
            if ($LASTEXITCODE -eq 0) {
              $localShasum = (Get-FileHash -LiteralPath $Tarball -Algorithm SHA1).Hash.ToLowerInvariant()
              if (($publishedShasum | Out-String).Trim().ToLowerInvariant() -ne $localShasum) {
                throw "published_package_shasum_mismatch_$Package"
              }
              Write-Host "npm_package_already_published_$Package"
              return
            }
            npm publish $Tarball --access public
            if ($LASTEXITCODE -ne 0) { throw "npm_publish_failed_$Package" }
          }
          Publish-NpmPackage "docs/tmp/packages/zzusp-dingtalk-dsh-observer-$version.tgz" "@zzusp/dingtalk-dsh-observer@$version"
          Publish-NpmPackage "docs/tmp/packages/zzusp-dingtalk-dsh-assistant-$version.tgz" "@zzusp/dingtalk-dsh-assistant@$version"
          Publish-NpmPackage "docs/tmp/packages/dingtalk-dsh-assistant-$version.tgz" "dingtalk-dsh-assistant@$version"
      - name: 回读 npm 后创建 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $expected = @(
            "@zzusp/dingtalk-dsh-observer@$version",
            "@zzusp/dingtalk-dsh-assistant@$version",
            "dingtalk-dsh-assistant@$version"
          )
          $maxAttempts = 60
          $retryDelaySeconds = 10
          foreach ($package in $expected) {
            for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
              $published = npm view $package version --registry https://registry.npmjs.org/ 2>$null
              $viewExitCode = $LASTEXITCODE
              if ($viewExitCode -eq 0 -and ($published | Out-String).Trim() -eq $version) {
                Write-Host "npm_readback_succeeded_$package`_attempt_$attempt"
                break
              }
              if ($attempt -eq $maxAttempts) { throw "npm_readback_failed_$package`_after_$maxAttempts`_attempts" }
              Write-Warning "npm_readback_pending_$package`_attempt_$attempt"
              Start-Sleep -Seconds $retryDelaySeconds
            }
          }
          $releaseJson = gh release view $env:RELEASE_TAG --json tagName,isDraft,isPrerelease,assets 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG docs/tmp/packages/*.tgz --verify-tag --title $env:RELEASE_TAG --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'github_release_create_failed' }
          }
          $releaseJson = gh release view $env:RELEASE_TAG --json tagName,isDraft,isPrerelease,assets
          if ($LASTEXITCODE -ne 0) { throw 'github_release_readback_failed' }
          $release = $releaseJson | ConvertFrom-Json
          $packages = @(Get-ChildItem -LiteralPath docs/tmp/packages -Filter '*.tgz')
          if ($packages.Count -ne 3 -or $release.tagName -ne $env:RELEASE_TAG -or $release.isDraft -or $release.isPrerelease -or $release.assets.Count -ne $packages.Count) {
            throw 'github_release_metadata_mismatch'
          }
          foreach ($file in $packages) {
            $assetRows = @($release.assets | Where-Object { $_.name -eq $file.Name })
            $sha256 = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($assetRows.Count -ne 1 -or $assetRows[0].size -ne $file.Length -or $assetRows[0].digest -ne "sha256:$sha256") {
              throw "github_release_asset_mismatch_$($file.Name)"
            }
          }
