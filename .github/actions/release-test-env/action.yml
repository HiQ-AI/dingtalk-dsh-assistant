name: Isolated release test environment
description: Frozen dependencies and synthetic native profile; no user credentials
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
      with:
        version: 10.13.1
    - uses: actions/setup-node@v7
      with:
        node-version: 22.13.0
        package-manager-cache: false
    - shell: pwsh
      run: '"NODE22_EXECUTABLE=$((Get-Command node).Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '11'
        cache: maven
        cache-dependency-path: test/fixtures/local-acceptance-spring/pom.xml
    - uses: actions/setup-node@v7
      with:
        node-version: 24.19.0
        cache: pnpm
    - shell: pwsh
      run: ./scripts/prepare-release-tests.ps1
    - shell: pwsh
      run: pnpm install --frozen-lockfile
    - shell: pwsh
      run: node scripts/verify-native-test-profile.mjs
    - shell: pwsh
      run: |
        mvn -B -f test/fixtures/local-acceptance-spring/pom.xml package
        if ($LASTEXITCODE -ne 0) { throw 'spring_test_fixture_build_failed' }
